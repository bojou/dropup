name: DropUp
options:
  bundleIdPrefix: app.dropup
  deploymentTarget:
    macOS: "14.0"
packages:
  DropUpCore:
    path: DropUpCore
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    # Exact, so the framework inside the app and the signing tools that come with it stay the same version.
    exactVersion: 2.10.0
targets:
  DropUp:
    type: application
    platform: macOS
    sources:
      - App/DropUp
    dependencies:
      - package: DropUpCore
        product: DropUpCore
      - package: DropUpCore
        product: DropUpTransport
      - package: Sparkle # Xcode puts Sparkle.framework into the app by itself; `embed: true` breaks the build
    info:
      path: App/DropUp/Info.plist
      properties:
        CFBundleDisplayName: DropUp
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true # starts menubar-only; WindowCoordinator adds a Dock icon while a window is open
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: ""
        # Quick Upload asks Finder which files are selected. macOS shows this text in its permission prompt.
        NSAppleEventsUsageDescription: DropUp reads which files are selected in Finder when you press the Quick Upload shortcut, so it can upload them.
        # Updates (Sparkle). The feed is the appcast attached to the latest release; the release workflow builds and
        # signs it. SUPublicEDKey is the public half of the key whose private half is the SPARKLE_PRIVATE_KEY secret.
        SUFeedURL: https://github.com/bojou/dropup/releases/latest/download/appcast.xml
        SUPublicEDKey: PYQ9M69VotH49iJ8G2gsz8azXY6HbL18JcJZqvDJRCM=
        SUEnableAutomaticChecks: true # on until the user turns it off in Settings, without Sparkle's own permission prompt
        SUAllowsAutomaticUpdates: false # the user always decides when to install
        SUScheduledCheckInterval: 86400
    # Needed with the hardened runtime for Quick Upload to be allowed to ask Finder. The release workflow signs with this file.
    entitlements:
      path: App/DropUp/DropUp.entitlements
      properties:
        com.apple.security.automation.apple-events: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dropup.DropUp
        # The app layer is thin UI glue; the strictly checked code lives in DropUpCore.
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
