name: Probe
on:
  push:
    branches: [core-stall-probe]
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        mode: [skip-keychain, skip-keys, skip-both, only-slow]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Start test FTP and SFTP servers
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install pyftpdlib asyncssh bcrypt
          "$RUNNER_TEMP/venv/bin/python" scripts/test-servers.py > "$RUNNER_TEMP/servers.log" 2>&1 &
          for _ in $(seq 1 30); do
            grep -q '^ready' "$RUNNER_TEMP/servers.log" && break
            sleep 1
          done
          grep '^export' "$RUNNER_TEMP/servers.log" | sed 's/^export //' >> "$GITHUB_ENV"
      - name: Build tests
        run: swift build --package-path DropUpCore --build-tests 2>&1 | tail -3
      - name: Test
        run: |
          sysctl -n hw.ncpu
          case "${{ matrix.mode }}" in
            skip-keychain) args="--skip KeychainStoreTests" ;;
            skip-keys) args="--skip KeyLoginIntegrationTests" ;;
            skip-both) args="--skip KeychainStoreTests --skip KeyLoginIntegrationTests" ;;
            only-slow) args="--filter KeychainStoreTests --filter KeyLoginIntegrationTests" ;;
          esac
          for round in 1 2 3; do
            echo "== round $round"
            set +e
            swift test --package-path DropUpCore --skip-build $args > "$RUNNER_TEMP/out-$round.log" 2>&1
            set -e
            grep -E '✘|Test run with' "$RUNNER_TEMP/out-$round.log" | head -8
            echo "fastest:"; grep -oE 'passed after [0-9.]+' "$RUNNER_TEMP/out-$round.log" | awk '{print $3}' | sort -n | head -3 | tr '\n' ' '; echo
            echo "slowest:"; grep -E ' passed after ' "$RUNNER_TEMP/out-$round.log" | awk '{print $(NF-1), $3}' | sort -rn | head -6
            echo "first finished:"; grep -m3 -E ' passed after ' "$RUNNER_TEMP/out-$round.log"
            echo "keychain/keys:"; grep -E '(removeAllPasswords|aWrongPassphraseSaysSo|aPassphraseWithACipher|signsInWith|Suite KeyLogin|Suite Keychain).*(passed|failed)' "$RUNNER_TEMP/out-$round.log" | head -8
            echo "unreachable:"; grep -E 'unreachablePortFailsFast.*(passed|failed|Expectation)' "$RUNNER_TEMP/out-$round.log" | head -3
          done
