name: Probe

on:
  push:
    branches: [menubar-only]
    paths: [.github/workflows/probe.yml]

jobs:
  probe:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build app
        run: xcodebuild -project DropUp.xcodeproj -scheme DropUp -configuration Release -destination 'platform=macOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Modes
        run: |
          APP=build/Build/Products/Release/DropUp.app/Contents/MacOS/DropUp
          for run in "ignoring:" "ignoring:1"; do
            mode=${run%%:*}; off=${run##*:}
            defaults delete app.dropup.DropUp 2>/dev/null || true
            if [ -n "$off" ]; then
              DROPUP_PROBE_MENUBAR=1 DROPUP_PROBE_MODE=$mode DROPUP_PROBE_NO_EDITKEYS=1 $APP > probe.log 2>&1 || true
            else
              DROPUP_PROBE_MENUBAR=1 DROPUP_PROBE_MODE=$mode $APP > probe.log 2>&1 || true
            fi
            echo "=== PROBE RESULTS mode=$mode noeditkeys=$off ==="
            grep -E "PROBE (mode|1 |2 |3 |4 |5 |6 |8\.|9\.|10\.|11\.|12|DONE)" probe.log || tail -20 probe.log
          done
