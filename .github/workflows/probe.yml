name: Probe

on:
  push:
    branches: [window-order-probe]

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build app and the stand-in for another app
        run: |
          xcodebuild -project DropUp.xcodeproj -scheme DropUp -configuration Release -destination 'platform=macOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          swiftc -o other-app .github/probe/other-app.swift
      - name: Drive the windows
        run: |
          sw_vers
          DROPUP_PROBE_FIXES="0,1,2,3,4,5,7,9,13,15" DROPUP_PROBE_WINDOWS=1 DROPUP_PROBE_HELPER="$PWD/other-app" build/Build/Products/Release/DropUp.app/Contents/MacOS/DropUp > probe.log 2>&1 || true
          echo "=== PROBE RESULTS ==="
          grep "^PROBE" probe.log || cat probe.log
