name: Probe

on:
  push:
    branches: [settings-perf-probe]

jobs:
  probe:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build app
        run: xcodebuild -project DropUp.xcodeproj -scheme DropUp -configuration Release -destination 'platform=macOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Time Settings
        run: |
          DROPUP_PROBE_SETTINGS=1 build/Build/Products/Release/DropUp.app/Contents/MacOS/DropUp > probe.log 2>&1 || true
          echo "=== PROBE RESULTS ==="
          grep PROBE probe.log || cat probe.log
