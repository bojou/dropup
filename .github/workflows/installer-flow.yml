name: Installer flow

# Walks through installing DropUp the way a person does, on real macOS runners, and checks what the app does:
#
#   drag          copy DropUp into Applications by hand, open it from there: it asks to eject the disk image.
#   double-click  open DropUp inside the disk image: it installs itself into Applications, opens that copy,
#                 and that copy ejects the disk image and moves the download to the Trash.
#
# The dialogs answer themselves here (DROPUP_ASSUME_YES=1), since nobody is at the keyboard.
# Run it by hand from the Actions tab after changing the install or eject code.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build and pack like a release
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project DropUp.xcodeproj -scheme DropUp -configuration Release \
            -destination 'platform=macOS' -derivedDataPath build \
            MARKETING_VERSION=9.9.9 CURRENT_PROJECT_VERSION=1 CODE_SIGNING_ALLOWED=NO build
          cp -R build/Build/Products/Release/DropUp.app DropUp.app
          codesign --force --options runtime --sign - DropUp.app
          mkdir dmg
          cp -R DropUp.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "DropUp" -srcfolder dmg -ov -format UDZO DropUp-9.9.9.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: dmg
          path: DropUp-9.9.9.dmg
          retention-days: 1

  flow:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
        scenario: [drag, double-click]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dmg
          path: ${{ runner.temp }}/dmg

      - name: Put the download where a browser would
        run: |
          mkdir -p "$HOME/Downloads"
          cp "$RUNNER_TEMP/dmg/DropUp-9.9.9.dmg" "$HOME/Downloads/"
          sw_vers

      - name: Mount the disk image the way Finder does
        run: |
          perl -e 'alarm shift; exec @ARGV' 20 open "$HOME/Downloads/DropUp-9.9.9.dmg" || echo "open timed out"
          for _ in $(seq 1 30); do [ -d /Volumes/DropUp/DropUp.app ] && break; sleep 1; done
          [ -d /Volumes/DropUp/DropUp.app ] || { echo "the disk image did not mount"; exit 1; }
          ls -la /Volumes/DropUp

      - name: Start watching DropUp's log
        run: |
          log stream --level debug --predicate 'subsystem == "app.dropup.DropUp"' > "$RUNNER_TEMP/app.log" 2>&1 &
          sleep 3

      - name: "drag: copy to Applications, open it, expect the eject question"
        if: matrix.scenario == 'drag'
        run: |
          ditto /Volumes/DropUp/DropUp.app /Applications/DropUp.app
          perl -e 'alarm shift; exec @ARGV' 20 open /Applications/DropUp.app || echo "open timed out"
          sleep 12
          cat > "$RUNNER_TEMP/windows.swift" <<'EOF'
          import CoreGraphics
          import Foundation
          let all = CGWindowListCopyWindowInfo([.optionAll], kCGNullWindowID) as? [[String: Any]] ?? []
          for w in all where (w[kCGWindowOwnerName as String] as? String) == "DropUp" {
              print("window layer", w[kCGWindowLayer as String] ?? "?", "onscreen", w[kCGWindowIsOnscreen as String] ?? false)
          }
          EOF
          perl -e 'alarm shift; exec @ARGV' 90 swift "$RUNNER_TEMP/windows.swift" || echo "window list failed"
          echo "--- DropUp log"
          grep -v 'CoreSimulator\|AssetsV2' "$RUNNER_TEMP/app.log"
          grep -q 'offering to eject' "$RUNNER_TEMP/app.log" || { echo "FAIL: the eject question was not asked"; exit 1; }

      - name: "double-click: open DropUp inside the disk image, expect it to install and clean up"
        if: matrix.scenario == 'double-click'
        run: |
          perl -e 'alarm shift; exec @ARGV' 20 open --env DROPUP_ASSUME_YES=1 /Volumes/DropUp/DropUp.app || echo "open timed out"
          for _ in $(seq 1 60); do
            if [ -d /Applications/DropUp.app ] && [ ! -d /Volumes/DropUp ] && pgrep -f '/Applications/DropUp.app/Contents/MacOS/DropUp' > /dev/null; then break; fi
            sleep 1
          done
          echo "--- DropUp log"
          grep -v 'CoreSimulator\|AssetsV2' "$RUNNER_TEMP/app.log"
          echo "--- processes"
          pgrep -lf 'DropUp.app/Contents/MacOS/DropUp' || echo "none"
          echo "--- Trash"
          ls -la "$HOME/.Trash" || true
          fail=0
          [ -d /Applications/DropUp.app ] || { echo "FAIL: DropUp was not installed into Applications"; fail=1; }
          pgrep -f '/Applications/DropUp.app/Contents/MacOS/DropUp' > /dev/null || { echo "FAIL: the installed copy did not open"; fail=1; }
          pgrep -f '/Volumes/DropUp/DropUp.app/Contents/MacOS/DropUp' > /dev/null && { echo "FAIL: the copy on the disk image is still running"; fail=1; }
          [ ! -d /Volumes/DropUp ] || { echo "FAIL: the disk image was not ejected"; fail=1; }
          [ ! -e "$HOME/Downloads/DropUp-9.9.9.dmg" ] || { echo "FAIL: the download is still in Downloads"; fail=1; }
          [ -e "$HOME/.Trash/DropUp-9.9.9.dmg" ] || { echo "FAIL: the download is not in the Trash"; fail=1; }
          exit $fail
