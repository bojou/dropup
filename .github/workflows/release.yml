name: Release

# Builds DropUp.app, signs and notarizes it when the signing secrets exist, packs it into a DMG and
# publishes a GitHub release. With the SPARKLE_PRIVATE_KEY secret it also signs the DMG for in-app updates and
# attaches the appcast that installed copies read. See docs/RELEASING.md for the secrets and how to create them.
#
#   • Push a tag like v0.1.0, or
#   • Run the workflow by hand from the Actions tab and type a version like 0.1.0.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, like 0.1.0 (the tag v0.1.0 is created on the current commit)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      # Whether the secrets exist. Secrets can't be tested directly in `if:`, so they are copied into booleans.
      HAS_CERT: ${{ secrets.MACOS_CERTIFICATE != '' && secrets.MACOS_CERTIFICATE_PASSWORD != '' }}
      HAS_NOTARY: ${{ secrets.NOTARY_APPLE_ID != '' && secrets.NOTARY_TEAM_ID != '' && secrets.NOTARY_PASSWORD != '' }}
      HAS_SPARKLE: ${{ secrets.SPARKLE_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the whole history and the tags, to list what changed since the last release

      - name: Work out the version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::Version must look like 1.2.3, got '$VERSION'"; exit 1 ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build
        run: |
          xcodebuild -project DropUp.xcodeproj -scheme DropUp -configuration Release \
            -destination 'platform=macOS' -derivedDataPath build \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO build
          cp -R build/Build/Products/Release/DropUp.app DropUp.app

      - name: Import the Developer ID certificate
        if: env.HAS_CERT == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.*)"/\1/')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::The certificate has no 'Developer ID Application' identity. Export the Developer ID Application certificate with its private key."
            exit 1
          fi
          # The certificate holder's name is not for the run logs. It stays inside the signature of the app, as
          # for every signed app, but a public repo should not print it as well.
          echo "::add-mask::$IDENTITY"
          NAME="$(printf '%s' "$IDENTITY" | sed -E 's/^Developer ID Application: (.*) \([A-Z0-9]+\)$/\1/')"
          if [ -n "$NAME" ] && [ "$NAME" != "$IDENTITY" ]; then echo "::add-mask::$NAME"; fi
          echo "SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      # The app carries Sparkle.framework. Everything inside it is signed first and the app last, each with the same
      # identity, because macOS refuses to load a framework signed by someone else into a hardened app (and
      # notarization rejects code that isn't signed with a timestamp).
      - name: Sign the app
        run: |
          if [ "$HAS_CERT" = "true" ]; then
            IDENTITY="$SIGNING_IDENTITY"
            STAMP="--timestamp"
          else
            echo "::warning::No signing secrets set. Using an ad-hoc signature, so macOS will warn on first launch."
            IDENTITY="-"
            STAMP=""
          fi
          sign() { codesign --force --options runtime $STAMP --sign "$IDENTITY" "$@"; }
          FRAMEWORK="DropUp.app/Contents/Frameworks/Sparkle.framework"
          if [ ! -d "$FRAMEWORK" ]; then
            echo "::error::Sparkle.framework is not inside the app, so it could never update itself."
            exit 1
          fi
          for ITEM in "$FRAMEWORK"/Versions/B/XPCServices/*.xpc "$FRAMEWORK/Versions/B/Autoupdate" "$FRAMEWORK/Versions/B/Updater.app"; do
            if [ ! -e "$ITEM" ]; then
              echo "::error::Expected $ITEM in Sparkle.framework. Its layout changed, so the signing order here needs a look."
              exit 1
            fi
            sign "$ITEM"
          done
          sign "$FRAMEWORK"
          sign DropUp.app
          codesign --verify --deep --strict --verbose=2 DropUp.app

      # Catches a build that is signed but won't start, before it is notarized and published.
      - name: Check the signed app starts
        run: |
          DropUp.app/Contents/MacOS/DropUp > launch.log 2>&1 &
          PID=$!
          sleep 6
          if ! kill -0 "$PID" 2>/dev/null; then
            echo "::error::The signed app quit within 6 seconds of starting."
            cat launch.log
            exit 1
          fi
          kill "$PID" || true

      - name: Notarize and staple the app
        if: env.HAS_CERT == 'true' && env.HAS_NOTARY == 'true'
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          ditto -c -k --keepParent DropUp.app DropUp-notarize.zip
          xcrun notarytool submit DropUp-notarize.zip --wait --timeout 30m \
            --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD"
          xcrun stapler staple DropUp.app
          xcrun stapler validate DropUp.app
          rm DropUp-notarize.zip

      - name: Build the DMG
        run: |
          mkdir dmg
          cp -R DropUp.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "DropUp" -srcfolder dmg -ov -format UDZO "DropUp-${{ steps.version.outputs.version }}.dmg"
          rm -rf dmg
          if [ "$HAS_CERT" = "true" ]; then
            codesign --force --timestamp --sign "$SIGNING_IDENTITY" "DropUp-${{ steps.version.outputs.version }}.dmg"
          fi

      - name: Notarize and staple the DMG
        if: env.HAS_CERT == 'true' && env.HAS_NOTARY == 'true'
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          DMG="DropUp-${{ steps.version.outputs.version }}.dmg"
          xcrun notarytool submit "$DMG" --wait --timeout 30m \
            --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD"
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG"

      - name: Warn that this release has no update feed
        if: env.HAS_SPARKLE != 'true'
        run: echo "::warning::SPARKLE_PRIVATE_KEY is not set, so this release has no appcast and installed copies of DropUp will not be offered it. See docs/RELEASING.md."

      # Sparkle checks the DMG's signature on the Mac before it installs an update, so the DMG is signed in its final
      # form, after notarization and stapling changed it. The private key only passes through the environment of this
      # step. scripts/sparkle-sign.sh also checks the signature against the public key inside the app.
      - name: Sign the update and write the appcast
        if: env.HAS_SPARKLE == 'true'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          echo "::add-mask::$SPARKLE_PRIVATE_KEY"
          brew list openssl@3 > /dev/null 2>&1 || brew install openssl@3
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          DMG="DropUp-$VERSION.dmg"
          PLIST="DropUp.app/Contents/Info.plist"
          if ! PUBLIC_KEY="$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' "$PLIST" 2> /dev/null)" || [ -z "$PUBLIC_KEY" ]; then
            echo "::error::The app has no SUPublicEDKey. Add the public key to project.yml (see docs/RELEASING.md)."
            exit 1
          fi
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")"
          SIGN_UPDATE="build/SourcePackages/artifacts/sparkle/Sparkle/bin/sign_update"
          SIGNED="$(scripts/sparkle-sign.sh "$SIGN_UPDATE" "$PUBLIC_KEY" "$DMG")"
          read -r SIGNATURE LENGTH <<< "$SIGNED"

          # What changed: the title of each commit since the previous release, without the pull request number.
          PREVIOUS="$(git tag --list 'v*' --sort=-v:refname | grep -vx "$TAG" | head -1 || true)"
          RANGE="HEAD"
          if [ -n "$PREVIOUS" ]; then RANGE="$PREVIOUS..HEAD"; fi
          git log --no-merges --format=%s -n 15 "$RANGE" | sed -E 's/ \(#[0-9]+\)$//' > release-notes.txt

          python3 scripts/make-appcast.py --version "$VERSION" --build "$BUILD" \
            --url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$DMG" \
            --signature "$SIGNATURE" --length "$LENGTH" --notes release-notes.txt --output appcast.xml
          xmllint --noout appcast.xml
          echo "Appcast for $VERSION (build $BUILD), signed and checked against the public key in the app."

      - name: Describe how this build is signed
        id: signing
        run: |
          if [ "$HAS_CERT" = "true" ] && [ "$HAS_NOTARY" = "true" ]; then
            echo "note=Signed with Developer ID and notarized by Apple. It opens without any warning." >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          elif [ "$HAS_CERT" = "true" ]; then
            echo "note=Signed with Developer ID but not notarized. On first launch, right-click DropUp and choose Open." >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "note=Not signed (ad-hoc only). On first launch, right-click DropUp and choose Open, then confirm." >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          DMG="DropUp-${{ steps.version.outputs.version }}.dmg"
          PRE="${{ steps.signing.outputs.prerelease }}"
          NOTES="${{ steps.signing.outputs.note }}

          Open the DMG and drag DropUp into Applications."
          ASSETS=("$DMG")
          if [ -f appcast.xml ]; then ASSETS+=(appcast.xml); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Re-running for the same version (for example after adding the signing secrets) replaces the files.
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" --prerelease="$PRE" --notes "$NOTES"
          else
            gh release create "$TAG" "${ASSETS[@]}" --target "$GITHUB_SHA" --title "DropUp ${{ steps.version.outputs.version }}" \
              --notes "$NOTES" --prerelease="$PRE"
          fi
