name: Explore Sparkle
on:
  push:
    branches: [automatic-updates]
jobs:
  explore:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen

      - name: Variant A, embed true as committed
        run: |
          set +e
          xcodegen generate
          xcodebuild -project DropUp.xcodeproj -scheme DropUp -configuration Release -destination 'platform=macOS' -derivedDataPath buildA CODE_SIGNING_ALLOWED=NO build > a.log 2>&1
          echo "exit $?"
          grep -n "error:\|error \|Copy .*Sparkle\|cp: " a.log | head -20
          ls buildA/Build/Products/Release/ | head

      - name: Variant B, no embed key
        run: |
          set +e
          sed -i '' '/embed: true/d' project.yml
          grep -n -B1 -A1 "package: Sparkle" project.yml
          xcodegen generate
          grep -c "Sparkle in Embed Frameworks" DropUp.xcodeproj/project.pbxproj
          xcodebuild -project DropUp.xcodeproj -scheme DropUp -configuration Release -destination 'platform=macOS' -derivedDataPath buildB CODE_SIGNING_ALLOWED=NO build > b.log 2>&1
          echo "exit $?"
          grep -n "error:\|error \|Copy .*Sparkle\|cp: " b.log | head -20
          ls buildB/Build/Products/Release/ | head
          ls buildB/Build/Products/Release/DropUp.app/Contents/Frameworks 2>&1 | head
          otool -L buildB/Build/Products/Release/DropUp.app/Contents/MacOS/DropUp | grep -i "sparkle\|rpath"
          otool -l buildB/Build/Products/Release/DropUp.app/Contents/MacOS/DropUp | grep -A2 LC_RPATH

      - name: Variant C, debug build as CI does
        run: |
          set +e
          xcodebuild -project DropUp.xcodeproj -scheme DropUp -destination 'platform=macOS' -derivedDataPath buildC CODE_SIGNING_ALLOWED=NO build > c.log 2>&1
          echo "exit $?"
          grep -n "error:\|error \|Copy .*Sparkle\|cp: " c.log | head -20
          ls buildC/Build/Products/Debug/DropUp.app/Contents/Frameworks 2>&1 | head
